<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TSoft</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback. Change pathSegmentsToKeep to 1 when the app
      // is served from a project path (e.g. https://user.github.io/repo/).
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
